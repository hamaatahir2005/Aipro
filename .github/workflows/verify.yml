name: Verify TradeMind
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: trademind
          POSTGRES_USER: trademind
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U trademind' --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend/tests -p test_quant.py -v
        env: {PYTHONPATH: backend}
      - run: pytest backend/tests/test_api.py -v
        env: {PYTHONPATH: backend}
      - run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://trademind:test-only-password@localhost/trademind
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter create --platforms=android --org com.trademind --project-name trademind .
        working-directory: mobile
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
      - run: flutter build apk --debug --dart-define=API_URL=https://api.example.invalid
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: trademind-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
